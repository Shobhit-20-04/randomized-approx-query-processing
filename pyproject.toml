[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adalog-sketch"
version = "0.2.0"
description = "AdaLog-Sketch: A Contiguous-Memory Approximate Query Processing Synopsis for Multi-Task Stream Analytics"
readme = "README.md"
authors = [
    { name = "Shobhit Agrawal", email = "shobhit.agrawal2026@vitstudent.ac.in" },
    { name = "Mayuri Rajendra Pawar", email = "mayuri.rajendra2026@vitstudent.ac.in" },
    { name = "Parveen Sultana H", email = "hparveensultana@vit.ac.in" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "xxhash>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "reportlab>=4.0.0",
]

[tool.setuptools.packages.find]
where = [".", "src", "src/python"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "src/python", "benchmarks"]
testpaths = ["tests"]
