[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "approx-query-processing"
version = "0.1.0"
description = "Randomized Data Structures for Approximate Query Processing: Bloom Filter, Count-Min Sketch, and HyperLogLog"
readme = "README.md"
authors = [{ name = "Shobhit", email = "researcher@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

