name: CI - Unit Tests & Quick Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build Native C++ Engine (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p core
          bash scripts/build/build_core.sh

      - name: Build Native C++ Engine (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call scripts\build\build_core.bat

      - name: Run Unit & Differential Tests
        run: |
          pytest -v tests/

      - name: Execute Quick Validation Benchmark
        run: |
          python scripts/run_quick_benchmark.py

      - name: Verify Benchmark Integrity
        run: |
          python scripts/verify_results.py
